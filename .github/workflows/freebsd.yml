# FreeBSD: build and test in a FreeBSD VM (GitHub has no FreeBSD runners). Formatting and clippy
# run in CI's other jobs; this one proves PrintCraft builds and its tests pass on FreeBSD.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (FreeBSD 14.3)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        # vmactions/freebsd-vm v1.5.9, pinned by commit: it runs our build, so a moved tag must
        # not change what executes here.
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: "14.3"
          usesh: true
          mem: 12288
          prepare: |
            pkg install -y curl git cmake pkgconf llvm19 perl5 \
              libxkbcommon wayland libX11 libXrandr libXi libXcursor mesa-libs gtk3
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -e
            . "$HOME/.cargo/env"
            # The checkout is copied in owned by another user; git (used by `xtask assets`) would
            # refuse it as "dubious ownership". The host's checkout step only trusts it out here.
            git config --global --add safe.directory "$PWD"
            export LIBCLANG_PATH=/usr/local/llvm19/lib
            # Linking the UI test binaries in parallel ran the VM out of memory: keep debug info
            # to line tables and cap the jobs.
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only CARGO_PROFILE_TEST_DEBUG=line-tables-only CARGO_BUILD_JOBS=4
            rustc --version
            cargo build --workspace --all-targets --locked
            cargo test --workspace --locked
            cargo xtask layers
